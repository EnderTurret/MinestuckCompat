modLoader="javafml"
loaderVersion="[1,)"
license="LGPL v2.1"
issueTrackerURL="https://github.com/EnderTurret/MinestuckCompat/issues"
[[mods]]
    modId="minestuckcompat"
    displayName="Minestuck Compat"
    description='''
    A comprehensive Minestuck addon that provides grist costs and combination recipes for:
    * Applied Energistics 2
    * Biomes O' Plenty
    * Create
    * Extra Delight
    * Farmer's Delight
    * Immersive Engineering
    * Mekanism
    * Minestuck
    * Rechiseled
    * Supplementaries
    * Vanilla (trims, sherds, 1.21.1 content, among other things)

    Also includes recipe interpreters (for use with the grist cost generator) for:
    * Applied Energistics 2
    * Create
    * Extra Delight
    * Farmer's Delight
    * Immersive Engineering
    * Mekanism

    Additionally, it also includes partial (or full) grist cost support for:
    * Applied Mekanistics
    * Builders Crafts & Additions 2
    * Create Ore Excavation
    * Dank Storage
    * Expanded Storage
    * FramedBlocks
    * GraveStone Mod
    * Hostile Neural Networks
    * Lootr
    '''
    version="${file.jarVersion}"
    authors="EnderTurret"
    displayURL="https://github.com/EnderTurret/MinestuckCompat"
    logoFile="icon.png"

[[mixins]]
    config="mixins.minestuckcompat.json"

[[dependencies.minestuckcompat]]
    modId="neoforge"
    type="required"
    versionRange="[21.1,21.2)"
    ordering="NONE"
    side="BOTH"

[[dependencies.minestuckcompat]]
    modId="minecraft"
    type="required"
    versionRange="[1.21,1.21.2)"
    ordering="NONE"
    side="BOTH"

[[dependencies.minestuckcompat]]
    modId="minestuck"
    type="required"
    versionRange="[1.21.1-1.13.1.0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.minestuckcompat]]
    modId="extrastuck"
    type="optional"
    ordering="AFTER"
    reason="Extrastuck's Create integration conflicts with Minestuck Compat's."

[[dependencies.minestuckcompat]]
    modId="minestuck_extended"
    type="optional"
    ordering="AFTER"
    reason="Minestuck Extended's Farmers Delight et al. integration conflicts with Minestuck Compat's."