modLoader="javafml"
loaderVersion="[1,)"
license="LGPL v2.1"
[[mods]]
    modId="minestuckcompat"
    displayName="Minestuck Compat"
    description='''
    A comprehensive Minestuck addon that provides grist costs and combination recipes for:
    * Applied Energistics 2
    * Biomes O' Plenty
    * Create
    * Mekanism
    * Minestuck (its trees)
    * Rechiseled
    * Vanilla (trims, sherds, 1.21.1 content, among other things)

    Also includes recipe interpreters (for use with the grist cost generator) for:
    * Applied Energistics 2
    * Create
    * Mekanism
    '''
    version="${file.jarVersion}"
    authors="EnderTurret"

[[mixins]]
    config="mixins.minestuckcompat.json"

[[dependencies.minestuckcompat]]
    modId="neoforge"
    type="required"
    versionRange="[21.1,21.2)"
    ordering="NONE"
    side="BOTH"

[[dependencies.minestuckcompat]]
    modId="minecraft"
    type="required"
    versionRange="[1.21,1.21.2)"
    ordering="NONE"
    side="BOTH"

[[dependencies.minestuckcompat]]
    modId="minestuck"
    type="required"
    versionRange="[1.21.1-1.13.1.0,)"
    ordering="NONE"
    side="BOTH"