// https://projects.neoforged.net/
plugins {
    id 'eclipse'
    id 'net.neoforged.moddev' version '2.0.107'
}

version = '1.1.1+1.21.1'
group = 'net.enderturret'
base {
    archivesName = 'MinestuckCompat'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven { url = "https://maven.createmod.net" } // Create, Ponder, Flywheel
    maven { url = "https://maven.ithundxr.dev/snapshots" } // Registrate
    maven {
        url 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven {
        name = 'ModMaven'
        url = 'https://modmaven.dev'
        content { // This maven is really slow, so only include the mods we need from it
            includeGroup 'mezz.jei'
            includeGroup 'mekanism'
        }
    }
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    // These mods need to be obtained manually and placed in /libs
    implementation 'com.mraof:Minestuck-1.21.1:1.13.1.0'
    runtimeOnly 'net.commoble:infiniverse-1.21:2.0.1.0'
    implementation 'com.supermartijn642:rechiseled-1.1.6a-neoforge:mc1.21'

    implementation 'maven.modrinth:ae2:19.2.17'
    implementation 'maven.modrinth:applied-mekanistics:1.6.2'
    implementation 'maven.modrinth:biomes-o-plenty:3RGurDCA' // 21.1.0.12
    implementation 'maven.modrinth:farmers-delight:1.21.1-1.2.9'
    implementation 'maven.modrinth:immersiveengineering:12.4.2-194'

    implementation 'mekanism:Mekanism:1.21.1-10.7.16.82'
    implementation 'mekanism:Mekanism:1.21.1-10.7.16.82:generators'
    implementation 'mekanism:Mekanism:1.21.1-10.7.16.82:tools'

    compileOnly "mezz.jei:jei-1.21.1-common-api:19.22.0.315"
    compileOnly "mezz.jei:jei-1.21.1-neoforge-api:19.22.0.315"

    implementation ('com.simibubi.create:create-1.21.1:6.0.6-98:slim') { transitive = false }

    runtimeOnly 'maven.modrinth:geckolib:RVIo5f6E' // 4.8.2
    runtimeOnly 'maven.modrinth:fusion-connected-textures:1.2.11b-neoforge-mc1.21'
    runtimeOnly 'maven.modrinth:supermartijn642s-config-lib:1.1.8-neoforge-mc1.21'
    runtimeOnly 'maven.modrinth:supermartijn642s-core-lib:1.1.18a-neoforge-mc1.21'
    runtimeOnly 'maven.modrinth:guideme:21.1.14'
    runtimeOnly 'net.createmod.ponder:Ponder-NeoForge-1.21.1:1.0.59'
    runtimeOnly 'dev.engine-room.flywheel:flywheel-neoforge-1.21.1:1.0.4'
    implementation 'com.tterrag.registrate:Registrate:MC1.21-1.3.0+62'
    runtimeOnly 'maven.modrinth:terrablender:6e8GCrLb' // 4.1.0.8
    runtimeOnly 'maven.modrinth:glitchcore:8wmCpbQ2' // 2.1.0.0
}

neoForge {
    version = '21.1.203'

    mods {
        minestuckcompat {
            sourceSet sourceSets.main
        }
    }

    parchment {
        // https://parchmentmc.org/docs/getting-started
        // https://ldtteam.jfrog.io/ui/native/parchmentmc-public/org/parchmentmc/data/
        minecraftVersion = '1.21.1'
        mappingsVersion = '2024.11.17'
    }

    runs {
        client {
            client()
            ideName = 'runMinestuckCompatClient'
            systemProperty('foxfilter.dev', 'true')
        }

        server {
            server()
            ideName = 'runMinestuckCompatServer'
        }

        data {
            data()
            ideName = 'runMinestuckCompatData'
            programArguments.addAll '--mod', 'minestuckcompat', '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
            systemProperty('minestuckcompat.datagen', 'true')
        }
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title': 'Minestuck Compat',
            'Specification-Vendor': 'EnderTurret',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': "${version}",
            'Implementation-Vendor' :'EnderTurret'
        ])
    }

    exclude '.cache'
    exclude 'net/enderturret/minestuckcompat/data/**'
    exclude 'net/enderturret/minestuckcompat/mixin/perf/small_grist_set/data/**'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.named('processResources', ProcessResources).configure {
    doLast {
        fileTree(dir: outputs.files.asPath, include: '**/*.json').each {
            File file -> file.text = groovy.json.JsonOutput.toJson(new groovy.json.JsonSlurper().parse(file))
        }
    }
}