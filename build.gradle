// https://projects.neoforged.net/
plugins {
    id 'eclipse'
    id 'net.neoforged.moddev' version '2.0.107'
}

version = '1.1.1+1.21.1'
group = 'net.enderturret'
base {
    archivesName = 'MinestuckCompat'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    implementation 'com.mraof:Minestuck-1.21.1:1.13.1.0'
    // Minestuck dependencies
    runtimeOnly 'software.bernie:geckolib-neoforge-1.21.1:4.7.6'
    runtimeOnly 'net.commoble:infiniverse-1.21:2.0.1.0'

    implementation 'mekanism:Mekanism-1.21.1:10.7.15.81'
    implementation 'mekanism:MekanismTools-1.21.1:10.7.15.81'

    implementation 'com.supermartijn642:rechiseled-1.1.6a-neoforge:mc1.21'
    runtimeOnly 'com.supermartijn642:fusion-1.2.11a-neoforge:mc1.21'
    runtimeOnly 'com.supermartijn642:supermartijn642configlib-1.1.8-neoforge:mc1.21'
    runtimeOnly 'com.supermartijn642:supermartijn642corelib-1.1.18a-neoforge:mc1.21'

    implementation 'appeng:appliedenergistics2:19.2.15'
    runtimeOnly 'guideme:guideme:21.1.14'

    implementation 'me.ramidzkh:Applied-Mekanistics:1.6.2'

    implementation 'com.simibubi:create-1.21.1:6.0.6'
    implementation 'com.tterrag:Registrate-MC1.21-1.3.0+62'

    implementation 'biomesoplenty:BiomesOPlenty-neoforge-1.21.1:21.1.0.12'
    runtimeOnly 'terrablender:TerraBlender-neoforge-1.21.1:4.1.0.8'
    runtimeOnly 'glitchcore:GlitchCore-neoforge-1.21.1:2.1.0.0'

    implementation 'vectorwing:FarmersDelight-1.21.1:1.2.9'

    implementation 'blusunrize:ImmersiveEngineering-1.21.1:12.4.2-194'
}

neoForge {
    version = '21.1.203'

    mods {
        minestuckcompat {
            sourceSet sourceSets.main
        }
    }

    parchment {
        // https://parchmentmc.org/docs/getting-started
        // https://ldtteam.jfrog.io/ui/native/parchmentmc-public/org/parchmentmc/data/
        minecraftVersion = '1.21.1'
        mappingsVersion = '2024.11.17'
    }

    runs {
        client {
            client()
            ideName = 'runMinestuckCompatClient'
            systemProperty('foxfilter.dev', 'true')
        }

        server {
            server()
            ideName = 'runMinestuckCompatServer'
        }

        data {
            data()
            ideName = 'runMinestuckCompatData'
            programArguments.addAll '--mod', 'minestuckcompat', '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
            systemProperty('minestuckcompat.datagen', 'true')
        }
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
            'Specification-Title': 'Minestuck Compat',
            'Specification-Vendor': 'EnderTurret',
            'Specification-Version': '1',
            'Implementation-Title': project.name,
            'Implementation-Version': "${version}",
            'Implementation-Vendor' :'EnderTurret'
        ])
    }

    exclude '.cache'
    exclude 'net/enderturret/minestuckcompat/data/**'
    exclude 'net/enderturret/minestuckcompat/mixin/perf/small_grist_set/data/**'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.named('processResources', ProcessResources).configure {
    doLast {
        fileTree(dir: outputs.files.asPath, include: '**/*.json').each {
            File file -> file.text = groovy.json.JsonOutput.toJson(new groovy.json.JsonSlurper().parse(file))
        }
    }
}